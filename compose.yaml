services:
  blog:
    container_name: malrang-blog
    build:
      context: .
      dockerfile: Dockerfile
    image: blog-malrang:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: /app/data/blog.db
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: https://blog.malrang.net
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    name: ${REVERSE_PROXY_NETWORK:-reverse-proxy}
    external: true
